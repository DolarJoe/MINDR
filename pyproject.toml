[project]
name = "MINDR"
version = "1.0.0"
description = "Placeholder description"
packages = []
authors = []
dependencies = [
    "oarepo[s3,rdm]==14.2.1rc2",
    "oarepo-app[production,ccmm]==6.3.0",
]
requires-python = ">=3.14,<3.15"

[project.entry-points."invenio_assets.webpack"]
i18n = "i18n.webpack:theme"
components = "ui.components.webpack:theme"
ui_dataset = "ui.dataset.webpack:theme"

[project.entry-points."invenio_i18n.translations"]
translations = "i18n"

[project.entry-points."invenio_db.alembic"]
repository = "common:alembic"

[project.entry-points."invenio_oauth2server.scopes"]
rdm_full_access = "common.oauth2_scopes:rdm_full_access"
rdm_read = "common.oauth2_scopes:rdm_read"
rdm_write = "common.oauth2_scopes:rdm_write"

[project.entry-points."invenio_base.blueprints"]
ui_dataset = "ui.dataset:create_blueprint"

[project.entry-points."invenio_base.finalize_app"]
ui_dataset = "ui.dataset:finalize_app"

[project.entry-points."invenio_base.cli"]
mindr = "common.cli:create_cli"


[tool.uv.build-backend]
module-root = ""
module-name = ["common", "i18n", "ui", "models"]

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"
